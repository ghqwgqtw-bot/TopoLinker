
defaults:
  - _self_

experiment:
  name: experiment
  data_path: ./datasets
  prefix_pretrain: 'protac_pretrain_train'
  prefix_preval: 'protac_pretrain_val'
  prefix_rltrain: 'protac_rltrain_train'
  prefix_rlval: 'protac_rltrain_val'
  prefix_test: 'protac_rltrain_test'
  # 50个batch打印一次训练loss
  log_freq: 80
  # 每 50 epoch保存一次 checkpoint
  ckpt_epoch_freq: 50

  use_wandb: False
  use_gpu: True
  learning_rate: 0.0002
#  lr_after_drop: 0.00005
#  lr_drop_epoch: 400
#  lr_warmup_epochs: 10

  ckpt_dir: ./checkpoints
  eval_dir: ./eval_outputs
  num_epoch: 1000
  train_batch_size: 16
  val_batch_size: 32
  diffusion_step: 200
  n_stability_samples: 5
  seed: 2026
  flow_denom_min: 0.05
  grad_clip_norm: 2.0

  center_of_mass: anchors

  x0_weight: 0.05

  topology_weight: 0.0145
  topology_bond_coef: 3.0
  topology_bond_length_coef: 2.5
  topology_isolated_coef: 0.70
  linker_positive_weight: 1.6

  use_no_loss: false

  aux_min_scale: 0.3
  aux_warmup_epochs: 10
  aux_ramp_epochs: 700


model:
  c_s: 128
  no_heads: 8

  # 新增 pair-state topology backbone
  c_z: 96
  n_pair_blocks: 10
  coord_scale: 0.16
  triangle_scale: 0.24

  use_local_geometry_refiner: true
  n_local_geom_blocks: 1
  local_geom_hidden_dim: 128
  local_geom_coord_scale: 0.06

  # Ablation switches
  use_pair_type: true
  use_triangle: true
  use_pair_bias: true
